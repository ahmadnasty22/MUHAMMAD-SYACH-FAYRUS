  </text>

  <line x1="22" y1="47" x2="738" y2="47" stroke="#252535" stroke-width="1"/>

  <!-- Column separators -->
  <line x1="253" y1="47" x2="253" y2="166" stroke="#7A00FF" stroke-opacity="0.65"/>
